name: CodeQL

# C# requires a real build (WinUI/.NET 10, net*-windows TFM can't restore buildless on Ubuntu), so analyze
# by tracing the build on windows + mise. Run on push to main and weekly only (PRs rely on CI build-test).
on:
  push:
    branches: [main]
  schedule:
    - cron: '24 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
            runner: windows-latest
          - language: actions
            build-mode: none
            runner: ubuntu-latest
    steps:
      # harden-runner: audit only. Windows filtering is limited and CodeQL's endpoints vary by version
      # (bundle downloads, etc.), so block is brittle here.
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # C# is analyzed via a real build, so set up the same mise toolchain (.NET 10 / just) as CI.
      - name: Setup toolchain (mise)
        if: matrix.language == 'csharp'
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # build-mode: manual for C#. Trace compilation via the same just build (mise .NET 10) as CI to build a
      # complete C# database.
      - name: Build for CodeQL (C#)
        if: matrix.build-mode == 'manual'
        run: just build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
